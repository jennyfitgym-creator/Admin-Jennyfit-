<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Admin - Jennyfit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0d0c;
            --card: #18181b;
            --card-sub: #121215;
            --primary: #39FF14;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --danger: #ff2a2a;
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 50px;
        }
        
        /* PANTALLA DE LOGIN */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-box {
            background: var(--card);
            border: 1px solid rgba(57, 255, 20, 0.3);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo-text { font-size: 2rem; font-weight: 900; color: var(--primary); margin-bottom: 10px; letter-spacing: -1px; }
        .subtitle { font-size: 0.9rem; color: var(--muted); margin-bottom: 30px; }
        .btn-google {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: #ffffff; color: #18181b; border: none; border-radius: 50px;
            padding: 15px 20px; font-size: 1rem; font-weight: 800; font-family: inherit;
            cursor: pointer; width: 100%; transition: transform 0.2s;
        }
        .btn-google:active { transform: scale(0.97); }
        .btn-google svg { width: 24px; height: 24px; }
        
        /* DASHBOARD */
        #dashboard { display: none; width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        .header-admin { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .btn-logout { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .section-title { font-size: 1.2rem; font-weight: 900; color: var(--primary); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn-refresh { background: var(--card-sub); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
        
        .client-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .client-name { font-size: 1rem; font-weight: 900; color: var(--text); margin-bottom: 4px; }
        .client-info { font-size: 0.8rem; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
        .client-info b { color: var(--text); }
        .badge-expiry { display: inline-block; background: rgba(57, 255, 20, 0.1); color: var(--primary); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; border: 1px solid var(--primary); }
        .badge-expiry.expired { background: rgba(255, 42, 42, 0.1); color: var(--danger); border-color: var(--danger); }
        
        .loading-text { text-align: center; color: var(--primary); font-weight: bold; margin-top: 20px; display: none; }
        .empty-state { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 20px; background: var(--card-sub); border-radius: 12px; }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <div class="logo-text">JENNYFIT</div>
            <div class="subtitle">Panel de Administrador</div>
            
            <button id="btn-google" class="btn-google" onclick="iniciarSesionAdmin()">
                <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Iniciar Sesión con Google
            </button>
            <div id="login-loading" class="loading-text">⏳ Verificando credenciales...</div>
        </div>
    </div>

    <!-- PANTALLA DEL DASHBOARD -->
    <div id="dashboard">
        <div class="header-admin">
            <div>
                <div style="color: var(--primary); font-weight: 900; font-size: 1.2rem;">JENNYFIT ADMIN</div>
                <div id="admin-email-display" style="font-size: 0.8rem; color: var(--muted);"></div>
            </div>
            <button class="btn-logout" onclick="cerrarSesionAdmin()">Salir</button>
        </div>

        <div class="section-title">
            <span>👥 Lista de Clientes</span>
            <button class="btn-refresh" onclick="cargarClientes()">🔄 Actualizar</button>
        </div>
        
        <div id="loading-clients" class="loading-text">⏳ Cargando clientes...</div>
        <div id="clients-container"></div>
    </div>

    <!-- SCRIPTS DE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDT0lieijjz2sxbu6PqaLmkrQ_HsDadK5M",
            authDomain: "jennyfitapp.firebaseapp.com",
            projectId: "jennyfitapp",
            storageBucket: "jennyfitapp.firebasestorage.app",
            messagingSenderId: "492885885548",
            appId: "1:492885885548:web:64d40ccffe8dad340f4e49"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const CORREO_ADMIN = "jennyfit.gym@gmail.com";

        const loginScreen = document.getElementById('login-screen');
        const dashboard = document.getElementById('dashboard');
        const btnGoogle = document.getElementById('btn-google');
        const loginLoading = document.getElementById('login-loading');
        const adminEmailDisplay = document.getElementById('admin-email-display');
        const clientsContainer = document.getElementById('clients-container');
        const loadingClients = document.getElementById('loading-clients');

        // Función para iniciar sesión
        window.iniciarSesionAdmin = async function() {
            try {
                loginLoading.style.display = 'block';
                btnGoogle.style.display = 'none';
                
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                if (user.email !== CORREO_ADMIN) {
                    await signOut(auth);
                    alert("⛔ ACCESO DENEGADO\n\nEl correo " + user.email + " no tiene permisos de administrador.");
                    loginLoading.style.display = 'none';
                    btnGoogle.style.display = 'flex';
                }
            } catch (error) {
                console.error(error);
                alert("Error al iniciar sesión: " + error.message);
                loginLoading.style.display = 'none';
                btnGoogle.style.display = 'flex';
            }
        };

        // Función para cerrar sesión
        window.cerrarSesionAdmin = async function() {
            await signOut(auth);
        };

        // Función para traer los clientes de Firestore
        window.cargarClientes = async function() {
            loadingClients.style.display = 'block';
            clientsContainer.innerHTML = '';
            
            try {
                const querySnapshot = await getDocs(collection(db, "usuarios"));
                let clientesArray = [];

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Si el documento no tiene nombre, probablemente esté vacío o mal sincronizado
                    if (data.jennyfit_username) {
                        clientesArray.push({
                            uid: doc.id,
                            nombre: data.jennyfit_username || 'Sin Nombre',
                            email: data.jennyfit_google_email || 'Sin correo',
                            cedula: data.jennyfit_user_cedula || 'Sin cédula',
                            telefono: data.jennyfit_user_telf || 'Sin teléfono',
                            // La fecha de vencimiento se guarda como string de milisegundos
                            expiraMs: parseInt(data.jennyfit_membership_expiry || '0'),
                            ultimaAct: data._syncMeta?.ultimaActualizacion || 0
                        });
                    }
                });

                // Ordenar por fecha de actualización (los más recientes primero)
                clientesArray.sort((a, b) => b.ultimaAct - a.ultimaAct);

                loadingClients.style.display = 'none';

                if (clientesArray.length === 0) {
                    clientsContainer.innerHTML = '<div class="empty-state">Aún no hay clientes registrados o sincronizados en la nube.</div>';
                    return;
                }

                // Dibujar cada cliente
                clientesArray.forEach(cliente => {
                    let estadoMembresia = "Sin membresía asignada";
                    let claseBadge = "badge-expiry expired";

                    if (cliente.expiraMs > 0) {
                        const fechaExp = new Date(cliente.expiraMs);
                        const ahora = new Date();
                        
                        const opcionesFecha = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };
                        const fechaStr = fechaExp.toLocaleDateString('es-VE', opcionesFecha);

                        if (cliente.expiraMs > ahora.getTime()) {
                            estadoMembresia = `Activo hasta: ${fechaStr}`;
                            claseBadge = "badge-expiry";
                        } else {
                            estadoMembresia = `Vencido el: ${fechaStr}`;
                            claseBadge = "badge-expiry expired";
                        }
                    }

                    const card = document.createElement('div');
                    card.className = 'client-card';
                    card.innerHTML = `
                        <div class="client-name">${cliente.nombre}</div>
                        <div class="client-info">
                            📧 <b>Correo:</b> ${cliente.email}<br>
                            🪪 <b>Cédula:</b> ${cliente.cedula} | 📲 <b>WhatsApp:</b> ${cliente.telefono}
                        </div>
                        <div class="${claseBadge}">${estadoMembresia}</div>
                    `;
                    clientsContainer.appendChild(card);
                });

            } catch (error) {
                console.error("Error al cargar clientes:", error);
                loadingClients.style.display = 'none';
                clientsContainer.innerHTML = `<div class="empty-state" style="color: var(--danger);">Error al cargar: Asegúrate de haber publicado las reglas de Firestore en modo lectura.</div>`;
            }
        };

        // Observador del estado de sesión
        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email === CORREO_ADMIN) {
                    loginScreen.style.display = 'none';
                    dashboard.style.display = 'block';
                    adminEmailDisplay.innerText = user.email;
                    cargarClientes(); // Carga automática al entrar
                } else {
                    signOut(auth);
                }
            } else {
                loginScreen.style.display = 'flex';
                dashboard.style.display = 'none';
                loginLoading.style.display = 'none';
                btnGoogle.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
