<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Armador de Index - Móvil Seguro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --verde: #39FF14; --fondo: #0b0d0c; --caja: #18181b; --borde: #3f3f46; }
        body { background-color: var(--fondo); color: #f4f4f5; font-family: system-ui, sans-serif; padding: 10px; margin: 0; padding-bottom: 220px; }
        h1 { color: var(--verde); font-size: 1.2rem; text-align: center; margin-bottom: 5px; }
        p.sub { text-align: center; color: #a1a1aa; font-size: 0.75rem; margin-top: 0; margin-bottom: 15px; }
        
        .btn-upload { display: block; width: 100%; padding: 15px; background: #06b6d4; color: #000; font-weight: 900; text-align: center; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; cursor: pointer; }
        #file-input, #json-input { display: none; }

        details { background: var(--caja); border: 1px solid var(--borde); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
        details[open] { border-color: var(--verde); }
        summary { padding: 12px; font-size: 0.85rem; font-weight: bold; color: #06b6d4; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '▼'; color: #a1a1aa; font-size: 0.7rem; }
        details[open] summary::after { content: '▲'; }
        .lleno { color: var(--verde) !important; }
        .lleno::after { content: '✔️' !important; }

        textarea { 
            width: 100%; height: 150px; background: #09090b; color: var(--verde); 
            border: none; border-top: 1px solid var(--borde); border-bottom: 1px solid var(--borde);
            padding: 10px; font-family: monospace; font-size: 0.8rem; resize: vertical; box-sizing: border-box;
        }
        textarea:focus { outline: none; }
        
        .box-tools { display: flex; gap: 5px; padding: 8px; background: #121214; }
        .box-tools button { flex: 1; padding: 8px; border: none; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; color: white; }
        .btn-paste { background: #06b6d4; color: #000 !important; }
        .btn-undo { background: #f59e0b; color: #000 !important; }
        .btn-clear { background: #ef4444; }

        .controls { background: var(--caja); padding: 10px; position: fixed; bottom: 0; left: 0; right: 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.9); border-top: 1px solid var(--verde); z-index: 100; }
        .progress-bar { width: 100%; height: 5px; background: #27272a; border-radius: 3px; margin-bottom: 8px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--verde); width: 0%; transition: 0.3s; }
        .status-text { font-size: 0.7rem; color: #a1a1aa; text-align: center; margin-bottom: 8px; display: block; }
        
        input[type="text"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--borde); background: #09090b; color: white; box-sizing: border-box; font-size: 0.85rem; margin-bottom: 8px; text-align: center; }
        
        .btn-group { display: flex; gap: 6px; margin-bottom: 6px; }
        .btn-group:last-child { margin-bottom: 0; }
        .btn-group button { flex: 1; padding: 10px 4px; border: none; border-radius: 6px; font-size: 0.75rem; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .btn-main { background: var(--verde); color: #051405; }
        .btn-secondary { background: #3f3f46; color: white; }
        .btn-zip { background: #8b5cf6; color: white; }
        .btn-save { background: #eab308; color: #000; }
        .btn-danger { background: #ef4444; color: white; }
        
        #persist-warning { display: none; background: #7f1d1d; color: white; font-size: 0.75rem; padding: 8px; border-radius: 6px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>Armador Móvil Seguro</h1>
    <p class="sub">Carga tus archivos, edita con los botones y guarda tu respaldo.</p>

    <div id="persist-warning">⚠️ Tu navegador no garantiza guardar los datos. Usa "Guardar Progreso" antes de salir.</div>

    <label for="file-input" class="btn-upload">📂 Cargar archivos .txt</label>
    <input type="file" id="file-input" multiple accept=".txt">

    <div id="blocks-container"></div>

    <div class="controls">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="status-text" id="status-text">Esperando archivos...</span>
        
        <input type="text" id="filename" value="index" placeholder="Nombre del archivo final HTML">
        
        <div class="btn-group">
            <button class="btn-main" onclick="descargarHTML()">⬇️ HTML</button>
            <button class="btn-zip" onclick="descargarZIP()">📦 ZIP</button>
            <button class="btn-secondary" onclick="previsualizarHTML()">👁️ Ver</button>
        </div>
        
        <div class="btn-group">
            <button class="btn-save" onclick="exportarProyecto()">💾 Guardar Progreso</button>
            <button class="btn-secondary" onclick="document.getElementById('json-input').click()">📂 Cargar Progreso</button>
            <input type="file" id="json-input" accept=".json" onchange="importarProyecto(event)">
        </div>

        <div class="btn-group">
            <button class="btn-danger" onclick="resetearTodo()" style="width:100%;">🗑️ Borrar todo el progreso</button>
        </div>
    </div>

    <script>
        const BLOQUES = [
            "1. sbloqueantesdetodos.txt", "2. bloque2A.txt", "3. bloque2b.txt", "4. bloque2C.txt",
            "5. bloque2D.txt", "6. bloquepegardespuesdebloqueantesdetodosytodoslosbloques2.txt",
            "7. bloque1A.txt", "8. bloque1B.txt", "9. bloque1c.txt", "10. bloque1d.txt",
            "11. bloque3A.txt", "12. bloque3B.txt", "13. bloque3C.txt", "14. bloque4A.txt",
            "15. bloque4B.txt", "16. bloque4CA.txt", "17. bloque4CB.txt", "18. bloque5A.txt",
            "19. bloque5b.txt", "20. bloque5C.txt", "21. bloque5D.txt", "22. bloque5E.txt",
            "23. bloque6A.txt", "24. bloque6B.txt"
        ];

        const container = document.getElementById('blocks-container');
        const fileInput = document.getElementById('file-input');
        let db;

        // 1. SOLICITAR ALMACENAMIENTO PERSISTENTE (Evita que Chrome borre los datos)
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().then(granted => {
                if (!granted) {
                    document.getElementById('persist-warning').style.display = 'block';
                }
            });
        }

        // 2. INICIAR INDEXEDDB (Base de datos interna mucho más segura)
        const request = indexedDB.open("ArmadorDB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("bloques")) {
                db.createObjectStore("bloques");
            }
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            cargarDesdeBaseDeDatos(); // Cargar datos existentes al abrir
        };

        // 3. CREAR LAS CASILLAS
        BLOQUES.forEach((nombre, index) => {
            const details = document.createElement('details');
            details.id = 'container-' + index;
            
            const summary = document.createElement('summary');
            summary.innerText = nombre;
            summary.id = 'summary-' + index;
            
            const textarea = document.createElement('textarea');
            textarea.id = 'bloque-' + index;
            textarea.placeholder = 'Pega aquí el texto de ' + nombre;
            
            // Evento al escribir: guardar en las DOS bases de datos
            textarea.addEventListener('input', (e) => {
                guardarBloque(index, e.target.value);
                if (e.target.value.trim() !== '') {
                    summary.classList.add('lleno');
                } else {
                    summary.classList.remove('lleno');
                }
                actualizarProgreso();
            });

            const tools = document.createElement('div');
            tools.className = 'box-tools';

            const btnPaste = document.createElement('button');
            btnPaste.className = 'btn-paste';
            btnPaste.innerText = '📋 Pegar';
            btnPaste.onclick = async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    textarea.focus(); 
                    const start = textarea.selectionStart;
                    const end = textarea.selectionEnd;
                    textarea.value = textarea.value.substring(0, start) + text + textarea.value.substring(end);
                    textarea.dispatchEvent(new Event('input'));
                } catch (err) {
                    alert("Mantén presionado en el cuadro de texto y selecciona 'Pegar'.");
                }
            };

            const btnUndo = document.createElement('button');
            btnUndo.className = 'btn-undo';
            btnUndo.innerText = '↩️ Deshacer';
            btnUndo.onclick = () => {
                textarea.focus();
                document.execCommand('undo');
            };

            const btnClear = document.createElement('button');
            btnClear.className = 'btn-clear';
            btnClear.innerText = '🗑️ Borrar';
            btnClear.onclick = () => {
                if(confirm('¿Borrar el contenido de esta casilla?')) {
                    textarea.value = '';
                    textarea.dispatchEvent(new Event('input'));
                }
            };

            tools.appendChild(btnPaste);
            tools.appendChild(btnUndo);
            tools.appendChild(btnClear);

            details.appendChild(summary);
            details.appendChild(textarea);
            details.appendChild(tools);
            container.appendChild(details);
        });

        // 4. FUNCIONES DE GUARDADO Y CARGA
        function guardarBloque(index, valor) {
            // Guardar en localStorage (rápido)
            try { localStorage.setItem('jf_block_' + index, valor); } catch(e) {}
            
            // Guardar en IndexedDB (seguro)
            if (db) {
                const tx = db.transaction("bloques", "readwrite");
                tx.objectStore("bloques").put(valor, 'bloque_' + index);
            }
        }

        function cargarDesdeBaseDeDatos() {
            const tx = db.transaction("bloques", "readonly");
            const store = tx.objectStore("bloques");
            let cargados = 0;

            for (let i = 0; i < BLOQUES.length; i++) {
                const req = store.get('bloque_' + i);
                req.onsuccess = () => {
                    let valor = req.result;
                    // Si no está en IndexedDB, buscar en localStorage viejo
                    if (valor === undefined) {
                        valor = localStorage.getItem('jf_block_' + i);
                    }
                    
                    if (valor && valor.trim() !== '') {
                        const textarea = document.getElementById('bloque-' + i);
                        textarea.value = valor;
                        document.getElementById('summary-' + i).classList.add('lleno');
                        // Si vino de LS, guardarlo en IDB
                        if (req.result === undefined) guardarBloque(i, valor);
                    }
                    cargados++;
                    if (cargados === BLOQUES.length) actualizarProgreso();
                };
            }
        }

        // Carga de archivos .txt
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;
            
            document.getElementById('status-text').innerText = `Cargando ${files.length} archivos...`;
            let procesados = 0;

            files.forEach(file => {
                const match = file.name.match(/^(\d+)\./); 
                if (match) {
                    const numero = parseInt(match[1]);
                    const index = numero - 1; 
                    if (index >= 0 && index < BLOQUES.length) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const textarea = document.getElementById('bloque-' + index);
                            if (textarea) {
                                textarea.value = event.target.result;
                                textarea.dispatchEvent(new Event('input'));
                            }
                            procesados++;
                            if(procesados === files.length) {
                                document.getElementById('status-text').innerText = '¡Archivos cargados!';
                            }
                        };
                        reader.readAsText(file);
                    }
                }
            });
            fileInput.value = '';
        });

        function actualizarProgreso() {
            let llenos = 0;
            for (let i = 0; i < BLOQUES.length; i++) {
                const val = document.getElementById('bloque-' + i).value;
                if (val && val.trim() !== '') llenos++;
            }
            document.getElementById('progress-fill').style.width = `${(llenos / BLOQUES.length) * 100}%`;
            document.getElementById('status-text').innerText = `Progreso: ${llenos} de 24 bloques guardados`;
        }

        function obtenerHTMLUnido() {
            let contenidoFinal = '';
            for (let i = 0; i < BLOQUES.length; i++) {
                const txt = document.getElementById('bloque-' + i).value;
                if (txt) contenidoFinal += txt + '\n';
            }
            return contenidoFinal;
        }

        function descargarHTML() {
            const nombreInput = document.getElementById('filename').value.trim() || 'index';
            const contenidoFinal = obtenerHTMLUnido();
            if (!contenidoFinal) return alert("No hay contenido. Carga los archivos primero.");

            const blob = new Blob([contenidoFinal], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${nombreInput}_${new Date().toISOString().slice(0,10)}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function descargarZIP() {
            if (typeof JSZip === 'undefined') return alert("Error: JSZip no cargó. Revisa tu internet.");
            const zip = new JSZip();
            let archivos = 0;

            for (let i = 0; i < BLOQUES.length; i++) {
                const txt = document.getElementById('bloque-' + i).value;
                if (txt && txt.trim() !== '') {
                    zip.file(BLOQUES[i], txt);
                    archivos++;
                }
            }
            if (archivos === 0) return alert("No hay archivos para comprimir.");

            document.getElementById('status-text').innerText = 'Generando ZIP...';
            try {
                const content = await zip.generateAsync({ type: "blob" });
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Bloques_${new Date().toISOString().slice(0,10)}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                alert("Error al generar ZIP.");
            }
        }

        function previsualizarHTML() {
            const contenidoFinal = obtenerHTMLUnido();
            if (!contenidoFinal) return alert("No hay contenido para ver.");
            const win = window.open();
            win.document.write(contenidoFinal);
            win.document.close();
        }

        function exportarProyecto() {
            let proyecto = {};
            for (let i = 0; i < BLOQUES.length; i++) {
                proyecto['bloque_' + i] = document.getElementById('bloque-' + i).value;
            }
            const blob = new Blob([JSON.stringify(proyecto, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Respaldo_Armador_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            document.getElementById('status-text').innerText = '¡Respaldo guardado en tu teléfono!';
        }

        function importarProyecto(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const proyecto = JSON.parse(e.target.result);
                    for (let i = 0; i < BLOQUES.length; i++) {
                        if (proyecto['bloque_' + i] !== undefined) {
                            const textarea = document.getElementById('bloque-' + i);
                            textarea.value = proyecto['bloque_' + i];
                            textarea.dispatchEvent(new Event('input'));
                        }
                    }
                    alert("¡Progreso restaurado con éxito!");
                } catch (err) {
                    alert("Error al leer el archivo de respaldo.");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        function resetearTodo() {
            if (confirm("¿Seguro que quieres borrar todo? Asegúrate de haber guardado tu respaldo.")) {
                localStorage.clear();
                if(db) {
                    const tx = db.transaction("bloques", "readwrite");
                    tx.objectStore("bloques").clear();
                }
                setTimeout(() => location.reload(), 500);
            }
        }
    </script>
</body>
</html>
